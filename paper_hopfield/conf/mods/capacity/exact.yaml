# @package _global_
### scans with smaller step size to obtain a value for the capacity
capacity: 
  interrupt: True
  threshold: 0.95 #when training will STOP
  epsilon: 0.95 #when training will count as SUCCESSFUL
  n_checkpoints: 15
  start: 0.2
  step: 0.02
  stop: 2.001

params:
  exp_name : 'Capacity'

storage:
  capacity: True